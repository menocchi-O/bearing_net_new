<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RFQ Processing Dashboard - DEMO</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">

        <div class="dashboard">

            <!-- TOP LEFT -->
            <section id="emailPanel" class="panel email-panel">
                <div class="panel-header">
                    <h2>Current Email</h2>
                </div>

                <textarea id="emailInput"
                          placeholder="Paste email here..."></textarea>

                <div class="actions">
                    <button class="secondary" onclick="skip()">Skip</button>
                    <button id="cleanBtn" class="primary" onclick="clean()">Clean</button>
                    <button id="extractBtn" class="success" onclick="extract()">Extract</button>
                </div>
            </section>
            <!-- TOUR OVERLAY -->
            <div id="tourOverlay" class="tour-overlay"></div>

            <div id="tourCard" class="tour-card">
                <div class="tour-step">1 / 4</div>

                <h3></h3>

                <p>
                </p>

                <div class="tour-actions">
                    <button class="tour-skip" onclick="skipTour()">Skip tour</button>
                    <button class="tour-next" onclick="nextTourStep()">Next →</button>
                </div>
            </div>
            <!-- TOP RIGHT -->
            <section id="extractedData" class="panel data-panel">
                <div class="panel-header">
                    <h2>Extracted Data</h2>
                </div>

                <div class="form-grid">
                    <input placeholder="AZIENDA" id="azienda">
                    <input placeholder="PAESE" id="paese">
                    <input placeholder="EMAIL" id="email">
                    <input placeholder="CONTATTO" id="contatto">
                    <input placeholder="TELEFONO" id="telefono">
                    <input placeholder="ARTICOLO" id="articolo">
                    <input placeholder="MARCA" id="marca">
                    <input placeholder="QTA" id="qta">
                    <input placeholder="NOTE" id="note">
                </div>

                <button class="primary full-width" onclick="searchCode()">
                    Search Inner Code
                </button>
            </section>

            <!-- BOTTOM -->
            <section id="clearedText" class="panel cleaned-panel">
                <div class="panel-header">
                    <h2>Cleaned Text</h2>
                </div>

                <textarea id="cleanedText"
                          placeholder="Processed email will appear here..."></textarea>

                <div class="actions">
                    <button class="success" onclick="proceedToWeb()">
                        Proceed to Web
                    </button>
                </div>
            </section>
            <section id="offerLines" class="panel offer-lines">
                <div class="panel-header">
                    <h2>Offer Lines</h2>
                </div>
                <div class="table-container">
                    <table id="linesTable" style="">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Description</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </div>

        <!-- MODAL WINDOW -->
        <div id="reviewSection" class="hidden modal">

            <div class="modal-content panel">

                <h3>Review Match</h3>
                <button class="close-btn" onclick="closeReviewModal()">
                    ✖
                </button>
                <p>
                    <strong>Company Code:</strong>
                    <span id="companyCode"></span>
                </p>

                <table id="candidateTable">
                    <thead>
                        <tr>
                            <th>Candidate</th>
                            <th>Inner Code</th>
                            <th>Description</th>
                            <th>Score</th>
                            <th>Select</th>
                        </tr>
                    </thead>

                    <tbody></tbody>
                </table>

                <button class="success" onclick="selectItem()">Select</button>
                
            </div>

        </div>
        <!-- SIDE PANEL -->
        <div id="detailPanel" class="hidden detail-panel panel">

            <button onclick="closeDetailPanel()">✖</button>
            <h3>ERP Details</h3>

            <!-- CODMAT VRZ + DESCRIPTION -->
            <div class="field-row cols-3" id="itemID">
                <div class="field one_quarter">
                    <label for="innerCode">CODMAT</label>
                    <input id="innerCode" placeholder="CODICE VRZ">
                </div>

                <div class="field three_quarters">
                    <label for="description">DESCRIPTION</label>
                    <input id="description" placeholder="DESCRIPTION">
                </div>

                <div class="field three_quarters">
                    <label for="grpscoven">GRP SCO VEN</label>
                    <input id="grpscoven" placeholder="GRP SCO VEN">
                </div>
            </div>
            <div id="erpContent">

                <!-- GROSS PRICE - NET PRICE - DISC1 - DISC2 -->
                <div class="field-row cols-7-pzo form-grid">
                    <div class="field">
                        <label for="grossPrice">GROSS PRICE</label>
                        <input id="grossPrice">
                    </div>
                    <div class="field">
                        <label for="netPrice">NET PRICE</label>
                        <input id="netPrice">
                    </div>
                    <div class="field">
                        <label for="discount1">SCO 1</label>
                        <input id="discount1">
                    </div>
                    <div class="field">
                        <label for="discount2">SCO 2</label>
                        <input id="discount2">
                    </div>
                    <div class="field">
                        <label for="discount3">SCO 3</label>
                        <input id="discount3">
                    </div>
                    <div class="field">
                        <label for="aumento1">AUM 1</label>
                        <input id="aumento1">
                    </div>
                    <div class="field">
                        <label for="aumento2">AUM 2</label>
                        <input id="aumento2">
                    </div>
                </div>

                <!--  VERZO DISPO VEN - GIAC - ALL_INT - ALL_GLO - ORD_FOR - ORD_CLI -->
                <div class="field-row cols-7-qta form-grid">
                    <div class="field">
                        <!-- SITO  -->
                        <label for="1">SITO</label>
                        <input id="1">
                    </div>
                    <div class="field">
                        <!-- dispo = STOCK.QTYSTUACT - SUM(STOALL.QTYSTUACT) -->
                        <!-- BISOGNA TENER CONTO DELLA DIFFERENZA TRA Allocato interno 'A' e Allocato globale-->
                        <label for="disp1">DISPO_VEN</label>
                        <input id="disp1">
                    </div>
                    <div class="field">
                        <!-- GIACENZA = STOCK.QTYSTUACT -->
                        <label for="giac1">GIAC</label>
                        <input id="giac1">
                    </div>
                    <div class="field">
                        <!-- ALLOCATA = STOCK.CUMALLQTA -->
                        <!-- BISOGNA TENER CONTO DELLA DIFFERENZA TRA Allocato interno 'A' e Allocato globale-->
                        <label for="allInt1">ALL_INT</label>
                        <input id="allInt1">
                    </div>
                    <div class="field">
                        <!-- ALLOCATA = STOCK.CUMALLQTA -->
                        <!-- BISOGNA TENER CONTO DELLA DIFFERENZA TRA Allocato interno 'A' e Allocato globale-->
                        <label for="allGlo1">ALL_GLO</label>
                        <input id="allGlo1">
                    </div>
                    <div class="field">
                        <!-- ORDINATA FOR = PORDITM.QTYUOM -->
                        <label for="ordFor1">ORD_FOR</label>
                        <input id="ordFor1">
                    </div>
                    <div class="field">
                        <!-- ORDINATA FOR = PORDITM.QTYUOM -->
                        <label for="ordCli1">ORD_CLI</label>
                        <input id="ordCli1">
                    </div>
                </div>
                <!--  AMATI DISPO VEN - GIAC - ALL_INT - ALL_GLO - ORD_FOR - ORD_CLI -->
                <div class="field-row cols-7-qta form-grid">
                    <div class="field">
                        <!-- SITO  -->
                        <label for="2">SITO</label>
                        <input id="2">
                    </div>
                    <div class="field">
                        <!-- dispo = STOCK.QTYSTUACT - SUM(STOALL.QTYSTUACT) -->
                        <!-- BISOGNA TENER CONTO DELLA DIFFERENZA TRA Allocato interno 'A' e Allocato globale-->
                        <label for="disp2">DISPO_VEN</label>
                        <input id="disp2">
                    </div>
                    <div class="field">
                        <!-- GIACENZA = STOCK.QTYSTUACT -->
                        <label for="giac2">GIAC</label>
                        <input id="giac2">
                    </div>
                    <div class="field">
                        <!-- ALLOCATA = STOCK.CUMALLQTA -->
                        <!-- BISOGNA TENER CONTO DELLA DIFFERENZA TRA Allocato interno 'A' e Allocato globale-->
                        <label for="allInt2">ALL_INT</label>
                        <input id="allInt2">
                    </div>
                    <div class="field">
                        <!-- ALLOCATA = STOCK.CUMALLQTA -->
                        <!-- BISOGNA TENER CONTO DELLA DIFFERENZA TRA Allocato interno 'A' e Allocato globale-->
                        <label for="allGlo2">ALL_GLO</label>
                        <input id="allGlo2">
                    </div>
                    <div class="field">
                        <!-- ORDINATA FOR = PORDITM.QTYUOM -->
                        <label for="ordFor2">ORD_FOR</label>
                        <input id="ordFor2">
                    </div>
                    <div class="field">
                        <!-- ORDINATA FOR = PORDITM.QTYUOM -->
                        <label for="ordCli2">ORD_CLI</label>
                        <input id="ordCli2">
                    </div>
                </div>
                <!--  ORLA COMO DISPO VEN - GIAC - ALL_INT - ALL_GLO - ORD_FOR - ORD_CLI -->
                <div class="field-row cols-7-qta form-grid">
                    <div class="field">
                        <!-- SITO  -->
                        <label for="3">SITO</label>
                        <input id="3">
                    </div>
                    <div class="field">
                        <!-- dispo = STOCK.QTYSTUACT - SUM(STOALL.QTYSTUACT) -->
                        <!-- BISOGNA TENER CONTO DELLA DIFFERENZA TRA Allocato interno 'A' e Allocato globale-->
                        <label for="disp3">DISPO_VEN</label>
                        <input id="disp3">
                    </div>
                    <div class="field">
                        <!-- GIACENZA = STOCK.QTYSTUACT -->
                        <label for="giac3">GIAC</label>
                        <input id="giac3">
                    </div>
                    <div class="field">
                        <!-- ALLOCATA = STOCK.CUMALLQTA -->
                        <!-- BISOGNA TENER CONTO DELLA DIFFERENZA TRA Allocato interno 'A' e Allocato globale-->
                        <label for="allInt3">ALL_INT</label>
                        <input id="allInt3">
                    </div>
                    <div class="field">
                        <!-- ALLOCATA = STOCK.CUMALLQTA -->
                        <!-- BISOGNA TENER CONTO DELLA DIFFERENZA TRA Allocato interno 'A' e Allocato globale-->
                        <label for="allGlo3">ALL_GLO</label>
                        <input id="allGlo3">
                    </div>
                    <div class="field">
                        <!-- ORDINATA FOR = PORDITM.QTYUOM -->
                        <label for="ordFor3">ORD_FOR</label>
                        <input id="ordFor3">
                    </div>
                    <div class="field">
                        <!-- ORDINATA FOR = PORDITM.QTYUOM -->
                        <label for="ordCli3">ORD_CLI</label>
                        <input id="ordCli3">
                    </div>
                </div>
                <!--  ORLA CIVATE DISPO VEN - GIAC - ALL_INT - ALL_GLO - ORD_FOR - ORD_CLI -->
                <div class="field-row cols-7-qta form-grid">
                    <div class="field">
                        <!-- SITO  -->
                        <label for="4">SITO</label>
                        <input id="4">
                    </div>
                    <div class="field">
                        <!-- dispo = STOCK.QTYSTUACT - SUM(STOALL.QTYSTUACT) -->
                        <!-- BISOGNA TENER CONTO DELLA DIFFERENZA TRA Allocato interno 'A' e Allocato globale-->
                        <label for="disp4">DISPO_VEN</label>
                        <input id="disp4">
                    </div>
                    <div class="field">
                        <!-- GIACENZA = STOCK.QTYSTUACT -->
                        <label for="giac4">GIAC</label>
                        <input id="giac4">
                    </div>
                    <div class="field">
                        <!-- ALLOCATA = STOCK.CUMALLQTA -->
                        <!-- BISOGNA TENER CONTO DELLA DIFFERENZA TRA Allocato interno 'A' e Allocato globale-->
                        <label for="allInt4">ALL_INT</label>
                        <input id="allInt4">
                    </div>
                    <div class="field">
                        <!-- ALLOCATA = STOCK.CUMALLQTA -->
                        <!-- BISOGNA TENER CONTO DELLA DIFFERENZA TRA Allocato interno 'A' e Allocato globale-->
                        <label for="allGlo4">ALL_GLO</label>
                        <input id="allGlo4">
                    </div>
                    <div class="field">
                        <!-- ORDINATA FOR = PORDITM.QTYUOM -->
                        <label for="ordFor4">ORD_FOR</label>
                        <input id="ordFor4">
                    </div>
                    <div class="field">
                        <!-- ORDINATA FOR = PORDITM.QTYUOM -->
                        <label for="ordCli4">ORD_CLI</label>
                        <input id="ordCli4">
                    </div>
                </div>

                

            </div>
            <!-- CUSTOMER EMAIL -->
            <div class="field">
                <label for="replyAddress">CUSTOMER E-MAIL ADDRESS</label>
                <input id="replyAddress" placeholder="REPLY ADDRESS">
            </div>
            <h4>Reply</h4>
            <textarea id="replyBox"></textarea>
            <button class="success" onclick="sendReply()">Send</button>

        </div>

    </div>

    <script src="static/app.js"></script>
</body>
</html>
